; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts =
  pre:scripts/gzip_portal.py
  post:scripts/merge_firmware.py

; Linked into the firmware image:
;   ui_font.vlw  anti-aliased font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
;   portal.html.gz  the settings web page (gzipped by scripts/gzip_portal.py)
board_build.embed_files =
  data/ui_font.vlw
  data/portal.html.gz

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.4.2
